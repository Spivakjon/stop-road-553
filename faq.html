<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    (function(){
        var h='76ce328ac551588921a5ba6381b74ae0d5bd625370a43ffed526fd12ae0326ce';
        if(sessionStorage.getItem('a553')==='1')return;
        var p=prompt('הזינו סיסמה לכניסה לאתר:');
        if(!p){document.documentElement.innerHTML='';return;}
        async function c(s){var e=new TextEncoder().encode(s);var b=await crypto.subtle.digest('SHA-256',e);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
        c(p).then(function(r){if(r===h){sessionStorage.setItem('a553','1');}else{alert('סיסמה שגויה');document.documentElement.innerHTML='';}});
    })();
    </script>
    <title>שאלות ותשובות | עצרו את כביש 553 — שומרים על הבית</title>
    <meta name="description" content="כל מה שצריך לדעת על תוכנית כביש 553 — מה מתוכנן, מה עם הפקקים, הביטחון, הבריאות והסביבה, ולמה חלופת כביש 551 עדיפה. יש לכם שאלות? יש לנו תשובות.">
    <meta property="og:title" content="שאלות ותשובות | עצרו את כביש 553">
    <meta property="og:description" content="אם עוצרים את 553 — מה יהיה עם הפקקים? וכל יתר השאלות שמטרידות את תושבי לב השרון ותל מונד, עם תשובות מסודרות.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Heebo:wght@400;500;700;800;900&family=Rubik:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== Theme tokens ===== */
        body[data-theme="brand"] {
            --accent: #f4c01e; --accent-rgb: 244,192,30; --accent-ink: #1a1206;
            --accent2: #e0322a; --accent2-rgb: 224,50,42;
            --bg: #0e0d0b; --bg-2: #161310; --card: #1b1814; --card-2: #211d18;
            --line: #312b23; --ink: #f6f1e7; --ink-soft: #c9c0b1; --muted: #8c8275;
            --topbar-bg: rgba(14,13,11,0.86); --cta-btn-bg: #15110b; --cta-btn-fg: #f4c01e;
        }
        body[data-theme="crimson"] {
            --accent: #e23b32; --accent-rgb: 226,59,50; --accent-ink: #ffffff;
            --accent2: #f4c01e; --accent2-rgb: 244,192,30;
            --bg: #0c0b0c; --bg-2: #141012; --card: #1a1514; --card-2: #211917;
            --line: #322724; --ink: #f6efed; --ink-soft: #cdbfbb; --muted: #8c7f7a;
            --topbar-bg: rgba(12,11,12,0.86); --cta-btn-bg: #140d0d; --cta-btn-fg: #f4c01e;
        }
        body[data-theme="light"] {
            --accent: #d4322c; --accent-rgb: 212,50,44; --accent-ink: #ffffff;
            --accent2: #d99a0f; --accent2-rgb: 217,154,15;
            --bg: #faf7f3; --bg-2: #fffdf9; --card: #ffffff; --card-2: #fff7f4;
            --line: #ece5dd; --ink: #2b2622; --ink-soft: #5b524b; --muted: #8a7f76;
            --topbar-bg: rgba(250,247,243,0.9); --cta-btn-bg: #19120a; --cta-btn-fg: #ffffff;
        }
        body[data-theme="poster"] {
            --accent: #ffd400; --accent-rgb: 255,212,0; --accent-ink: #000000;
            --accent2: #ff2e2e; --accent2-rgb: 255,46,46;
            --bg: #000000; --bg-2: #0a0a0a; --card: #121212; --card-2: #181818;
            --line: #2b2b2b; --ink: #ffffff; --ink-soft: #d6d6d6; --muted: #8f8f8f;
            --topbar-bg: rgba(0,0,0,0.9); --cta-btn-bg: #000000; --cta-btn-fg: #ffd400;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Assistant', 'Heebo', sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1100px 520px at 80% -8%, rgba(var(--accent-rgb),0.12), transparent 60%),
                radial-gradient(900px 480px at -5% 8%, rgba(var(--accent2-rgb),0.10), transparent 55%),
                linear-gradient(180deg, var(--bg-2), var(--bg) 42%);
            background-attachment: fixed;
            line-height: 1.78;
            -webkit-font-smoothing: antialiased;
            transition: background 0.35s, color 0.35s;
        }

        h1, h2, h3, .display { font-family: 'Rubik', 'Heebo', sans-serif; }
        a { color: inherit; }
        .wrap { max-width: 880px; margin: 0 auto; padding: 0 1.25rem; }

        /* route sign */
        .route {
            display: inline-grid; place-items: center;
            background: #0c0b0a; color: #fff; border: 2px solid #fff; border-radius: 8px;
            font-family: 'Rubik', sans-serif; font-weight: 900; line-height: 1; letter-spacing: .5px;
        }

        /* ===== Top bar ===== */
        .topbar {
            position: sticky; top: 0; z-index: 50;
            background: var(--topbar-bg); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line); transition: background 0.35s;
        }
        .topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: .6rem; }
        .brand { display: flex; align-items: center; gap: .65rem; text-decoration: none; color: var(--ink); }
        .brand .route { width: 46px; height: 30px; font-size: .95rem; }
        .brand b { font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 1.02rem; }
        .brand b span { color: var(--accent); }
        .topbar .links { display: flex; align-items: center; gap: .5rem; }
        .topbar .lnk {
            text-decoration: none; color: var(--ink-soft); font-weight: 700; font-size: .85rem;
            padding: .42rem .85rem; border-radius: 999px; border: 1px solid var(--line);
            transition: all .2s; white-space: nowrap;
        }
        .topbar .lnk:hover { border-color: var(--accent); color: var(--accent); }
        .topbar .lnk.web { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
        .topbar .lnk.web:hover { filter: brightness(1.06); }

        /* ===== Theme switcher ===== */
        .theme-switch {
            display: flex; align-items: center; flex-wrap: wrap; gap: .45rem;
            padding: .7rem 0; justify-content: center;
            border-bottom: 1px solid var(--line);
        }
        .theme-switch .ts-label { font-size: .82rem; color: var(--muted); font-weight: 700; margin-inline-end: .2rem; }
        .theme-switch button {
            all: unset; cursor: pointer; font-family: 'Rubik', sans-serif; font-weight: 700;
            font-size: .82rem; color: var(--ink-soft);
            padding: .35rem .85rem; border-radius: 999px; border: 1px solid var(--line);
            transition: all .2s; display: inline-flex; align-items: center; gap: .35rem;
        }
        .theme-switch button .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
        .theme-switch button:hover { border-color: var(--accent); color: var(--ink); }
        .theme-switch button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
        .theme-switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* ===== Hero ===== */
        .hero { padding: 3.4rem 0 1.5rem; text-align: center; }
        .eyebrow {
            display: inline-block; transform: rotate(-2deg);
            background: var(--accent); color: var(--accent-ink);
            padding: .35rem 1.05rem; border-radius: 6px;
            font-family: 'Rubik', sans-serif; font-weight: 800; font-size: .9rem;
            margin-bottom: 1.3rem; box-shadow: 0 6px 18px rgba(var(--accent-rgb),0.22);
        }
        .hero h1 {
            font-weight: 900; line-height: 1.08; letter-spacing: -1px;
            font-size: clamp(2.4rem, 8vw, 4rem);
        }
        .hero h1 .y { color: var(--accent); }
        .hero .sub { color: var(--ink-soft); font-size: clamp(1.05rem, 2.6vw, 1.25rem); max-width: 600px; margin: 1.1rem auto 0; }
        .tagline { margin: 1.4rem auto 0; max-width: 640px; color: var(--muted); font-size: .95rem; font-weight: 600; letter-spacing: .2px; }

        /* ===== Highlight (traffic) ===== */
        .highlight {
            background: linear-gradient(135deg, var(--card-2), rgba(var(--accent-rgb),0.10));
            border: 1px solid rgba(var(--accent-rgb),0.5);
            border-radius: 18px; padding: 1.7rem 1.5rem; margin: 2.2rem 0 .5rem;
            display: flex; gap: 1rem; align-items: flex-start;
            box-shadow: 0 18px 50px rgba(0,0,0,.28);
        }
        .highlight .ic { font-size: 1.9rem; line-height: 1; flex-shrink: 0; }
        .highlight h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: .35rem; color: var(--accent); }
        .highlight p { color: var(--ink-soft); font-size: 1.02rem; }
        .highlight a { color: var(--accent); font-weight: 800; text-decoration: none; white-space: nowrap; }
        .highlight a:hover { text-decoration: underline; }

        /* ===== Chips ===== */
        .chips { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin: 2.4rem 0 .5rem; }
        .chips a {
            text-decoration: none; background: var(--card); border: 1px solid var(--line);
            color: var(--ink-soft); font-weight: 700; font-size: .88rem;
            padding: .42rem 1rem; border-radius: 999px; transition: all .2s;
        }
        .chips a:hover { border-color: var(--accent); color: var(--accent); }

        /* ===== Categories / FAQ ===== */
        .cat { margin-top: 2.8rem; }
        .cat-head { display: flex; align-items: center; gap: .75rem; margin-bottom: 1rem; padding-bottom: .65rem; border-bottom: 2px solid var(--line); }
        .cat-head .badge { background: var(--accent); color: var(--accent-ink); width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-size: 1.2rem; flex-shrink: 0; }
        .cat-head h2 { font-size: 1.4rem; font-weight: 800; }

        .qa { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: .75rem; overflow: hidden; transition: border-color .2s, box-shadow .2s, background .2s; }
        .qa.open { border-color: rgba(var(--accent-rgb),0.6); background: var(--card-2); box-shadow: 0 14px 40px rgba(0,0,0,.28); }
        .qa button.q {
            all: unset; display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            width: 100%; box-sizing: border-box; cursor: pointer; padding: 1.15rem 1.3rem;
            font-family: 'Rubik', 'Heebo', sans-serif; font-weight: 600; font-size: 1.08rem; color: var(--ink); line-height: 1.5;
        }
        .qa button.q:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 12px; }
        .qa .plus {
            flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
            background: rgba(var(--accent-rgb),0.16); color: var(--accent);
            display: grid; place-items: center; font-size: 1.4rem; font-weight: 700;
            transition: transform .3s ease, background .2s, color .2s;
        }
        .qa.open .plus { transform: rotate(45deg); background: var(--accent); color: var(--accent-ink); }
        .qa .a { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
        .qa .a-inner { padding: 0 1.3rem 1.3rem; color: var(--ink-soft); font-size: 1.03rem; }
        .qa .a-inner strong { color: var(--ink); font-weight: 700; }
        .qa .a-inner .tip {
            display: block; margin-top: .85rem; padding: .75rem .95rem;
            background: rgba(var(--accent-rgb),0.10); border-right: 3px solid var(--accent);
            border-radius: 8px; font-size: .97rem; color: var(--ink);
        }

        /* ===== Heart strip ===== */
        .heartstrip { margin-top: 3rem; text-align: center; padding: 2rem 1.2rem; border: 1px dashed var(--line); border-radius: 18px; background: rgba(var(--accent2-rgb),0.06); }
        .heartstrip .big { font-family: 'Rubik', sans-serif; font-weight: 900; font-size: clamp(1.4rem,4.5vw,2rem); line-height: 1.25; }
        .heartstrip .big .heart { color: var(--accent2); }

        /* ===== CTA ===== */
        .cta { margin: 2.2rem 0 0; background: var(--accent); color: var(--accent-ink); border-radius: 22px; padding: 2.8rem 1.8rem; text-align: center; }
        .cta h2 { font-size: clamp(1.6rem, 4.6vw, 2.25rem); font-weight: 900; line-height: 1.2; }
        .cta p { margin: .65rem auto 1.7rem; max-width: 470px; font-weight: 600; opacity: .85; }
        .cta-btns { display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; }
        .btn { text-decoration: none; font-weight: 800; font-family: 'Rubik', sans-serif; padding: .9rem 2.1rem; border-radius: 999px; font-size: 1.05rem; transition: transform .2s, box-shadow .2s, background .2s, color .2s; display: inline-block; }
        .btn-dark { background: var(--cta-btn-bg); color: var(--cta-btn-fg); }
        .btn-dark:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,.3); }
        .btn-out { background: transparent; color: var(--accent-ink); border: 2px solid var(--accent-ink); }
        .btn-out:hover { background: var(--accent-ink); color: var(--accent); }

        /* ===== Footer ===== */
        footer { text-align: center; padding: 2.6rem 1rem 3.2rem; color: var(--muted); font-size: .9rem; }
        footer .fbrand { display: inline-flex; align-items: center; gap: .55rem; color: var(--ink-soft); font-family: 'Rubik', sans-serif; font-weight: 800; margin-bottom: .5rem; }
        footer .fbrand .route { width: 42px; height: 27px; font-size: .85rem; }
        footer .fbrand span { color: var(--accent); }

        @media (max-width: 560px) {
            .hero { padding: 2.6rem 0 1.2rem; }
            .highlight { flex-direction: column; gap: .6rem; }
            .qa button.q { font-size: 1rem; padding: 1rem 1.05rem; }
            .qa .a-inner { padding: 0 1.05rem 1.05rem; }
            .cat-head h2 { font-size: 1.22rem; }
            .topbar .lnk:not(.web) { display: none; }
        }
    </style>
</head>
<body data-theme="brand">

    <!-- Top bar -->
    <header class="topbar">
        <div class="wrap">
            <a href="index.html" class="brand"><span class="route">553</span><b>שומרים על <span>הבית</span></b></a>
            <div class="links">
                <a href="index.html" class="lnk">חזרה לאתר</a>
                <a href="index.html#signup" class="lnk web">הצטרפו למאבק</a>
            </div>
        </div>
    </header>

    <div class="wrap">
        <!-- Design switcher -->
        <nav class="theme-switch" aria-label="בחירת עיצוב">
            <span class="ts-label">עיצוב:</span>
            <button data-set="brand" type="button"><span class="dot" style="background:#f4c01e"></span>כהה־צהוב</button>
            <button data-set="crimson" type="button"><span class="dot" style="background:#e23b32"></span>כהה־אדום</button>
            <button data-set="light" type="button"><span class="dot" style="background:#d4322c;outline:2px solid #fff;outline-offset:-2px"></span>בהיר</button>
            <button data-set="poster" type="button"><span class="dot" style="background:#ffd400;outline:2px solid #000;outline-offset:-2px"></span>פוסטר</button>
        </nav>
    </div>

    <main class="wrap">

        <!-- Hero (נטען דינמית מ-js/render-faq.js) -->
        <section class="hero" id="faqHero"></section>

        <!-- Traffic highlight -->
        <section class="highlight" id="faqHighlight"></section>

        <!-- Chips -->
        <nav class="chips" id="faqChips"></nav>

        <!-- קטגוריות השאלות (נטענות דינמית) -->
        <div id="faqCats"></div>

        <!-- Heart strip -->
        <section class="heartstrip" id="faqHeart"></section>

        <!-- CTA -->
        <section class="cta" id="faqCta"></section>

    </main>

    <footer>
        <div class="fbrand"><span class="route">553</span>שומרים על <span>הבית</span></div>
        <p>מטה תושבי תל מונד ולב השרון · יחד נבטיח עתיד טוב יותר</p>
    </footer>

    <!-- רינדור התוכן, אקורדיון ובורר עיצוב — במודול -->
    <script type="module" src="js/render-faq.js"></script>
</body>
</html>
